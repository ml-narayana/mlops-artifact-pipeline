name: Test Workflow

on:
  push:
    branches: [ test_branch ]  # Trigger only on test_branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest tests/test_train.py
